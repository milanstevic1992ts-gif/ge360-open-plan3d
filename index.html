<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>GE360 Rilievo</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div><div class="eyebrow">GE360</div><div class="title">Rilievo veloce</div></div>
      <div class="top-actions">
        <button id="undoBtn" class="icon-btn" aria-label="Annulla">↶</button>
        <button id="saveBtn" class="save-btn">SALVA</button>
      </div>
    </header>
    <main id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="emptyHint" class="empty-hint">
        <div class="finger">☝️</div>
        <div class="hint-title">Disegna come su un foglio</div>
        <div class="hint-text">Fai il giro della stanza o della casa con il dito.<br><b>Non serve essere preciso.</b></div>
      </div>
      <div id="statusPill" class="status-pill hidden"></div>
      <button id="clearBtn" class="clear-btn hidden">Pulisci</button>
    </main>
    <footer class="bottom-bar">
      <button id="drawBtn" class="tool active"><span class="tool-icon">✏️</span><span>SCHIZZA</span></button>
      <button id="doorBtn" class="tool"><span class="tool-icon">🚪</span><span>PORTA</span></button>
      <button id="windowBtn" class="tool"><span class="tool-icon">▣</span><span>FINESTRA</span></button>
      <button id="measureBtn" class="tool measure"><span class="tool-icon">📏</span><span id="measureLabel">MISURE</span></button>
      <button id="doneBtn" class="tool done"><span class="tool-icon">✓</span><span>FATTO</span></button>
    </footer>
  </div>
  <div id="sheetBackdrop" class="sheet-backdrop hidden">
    <section class="sheet">
      <div class="grabber"></div>
      <div id="sheetKicker" class="sheet-kicker">MISURA MURO</div>
      <div id="sheetValue" class="sheet-value">0,00 <span>m</span></div>
      <div class="keypad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key=",">,</button><button data-key="0">0</button><button data-key="⌫">⌫</button>
      </div>
      <div class="sheet-actions">
        <button id="laterBtn" class="secondary">DOPO</button>
        <button id="confirmBtn" class="primary">CONFERMA ✓</button>
      </div>
    </section>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="js/app.js"></script>
</body>
</html>
