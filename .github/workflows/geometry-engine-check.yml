name: Geometry Engine Check

on:
  push:
    branches: [ main, geometry-solver-integration, rooms-surfaces-v5, indicative-surfaces-v6, quick-edit-presentation-v7, full-audit-fixes-v8, llm-notes-debian-v9, frontend-audit-v10, frontend-audit-v11, small-room-surfaces-v13, tools-drawer-v14, auto-straight-walls-v16, corner-magnet-v18, frontend-backend-elaborati-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend module syntax
        run: |
          cp js/app.js /tmp/ge360-app.mjs
          cp js/room-surfaces.js /tmp/room-surfaces.mjs
          cp js/sketch-snap.js /tmp/sketch-snap.mjs
          node --check /tmp/ge360-app.mjs
          node --check /tmp/room-surfaces.mjs
          node --check /tmp/sketch-snap.mjs

      - name: Sketch straightening smoke tests
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { straightenPolyline, snapOrientation, snapPolylineCornersToWalls } from './js/sketch-snap.js';

          assert.equal(snapOrientation(200, 22, 25), 'h');
          assert.equal(snapOrientation(18, 220, 25), 'v');
          assert.equal(snapOrientation(100, 80, 25), 'free');

          const h = straightenPolyline([{x:0,y:0},{x:200,y:22}]);
          assert.equal(h[0].y, h[1].y);

          const v = straightenPolyline([{x:0,y:0},{x:18,y:220}]);
          assert.equal(v[0].x, v[1].x);

          const diagonal = straightenPolyline([{x:0,y:0},{x:100,y:80}]);
          assert.equal(diagonal[1].x, 100);
          assert.equal(diagonal[1].y, 80);

          // Disegno veloce di una stanza: lati storti e due segmenti quasi
          // collineari in alto devono diventare un rettangolo pulito.
          const room = straightenPolyline([
            {x:0,y:0},
            {x:95,y:8},
            {x:200,y:14},
            {x:214,y:295},
            {x:4,y:305},
            {x:0,y:0}
          ]);
          assert.equal(room.length, 5);
          assert.equal(room[0].x, room[room.length - 1].x);
          assert.equal(room[0].y, room[room.length - 1].y);
          assert.equal(room[0].y, room[1].y);
          assert.equal(room[1].x, room[2].x);
          assert.equal(room[2].y, room[3].y);
          assert.equal(room[3].x, room[4].x);

          const existingVertical = [
            { id:'old-v', a:{x:100,y:100}, b:{x:100,y:300}, lengthCm:200 }
          ];
          const incomingHorizontal = [{x:126,y:112},{x:300,y:112}];
          const corner = snapPolylineCornersToWalls(incomingHorizontal, existingVertical, {
            threshold: 40,
            axisToleranceDeg: 25
          });
          assert.equal(corner.wallUpdates.length, 1);
          assert.equal(corner.wallUpdates[0].mode, 'orthogonal');
          assert.equal(corner.points[0].x, 100);
          assert.equal(corner.points[0].y, 112);
          assert.equal(corner.wallUpdates[0].point.x, 100);
          assert.equal(corner.wallUpdates[0].point.y, 112);

          const existingEnd = [
            { id:'old-h', a:{x:0,y:0}, b:{x:100,y:0}, lengthCm:100 }
          ];
          const continuation = [{x:112,y:7},{x:200,y:80}];
          const endpoint = snapPolylineCornersToWalls(continuation, existingEnd, {
            threshold: 20,
            axisToleranceDeg: 25
          });
          assert.equal(endpoint.points[0].x, 100);
          assert.equal(endpoint.points[0].y, 0);

          console.log('GE360 sketch straightening smoke tests OK');
          NODE

      - name: Check corner magnet integration
        run: |
          grep -q "snapPolylineCornersToWalls" js/app.js
          grep -q "threshold: 46 / viewZoom" js/app.js
          grep -q "originalPoint" js/app.js

      - name: Geometry engine smoke tests
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { solveFloorPlan } from './geometry-engine/index.js';

          const rect = (last = 300, openings = []) => ({
            version: 4,
            planId: 'smoke',
            walls: [
              { id:'w1', a:{x:0,y:0}, b:{x:200,y:5}, lengthCm:400 },
              { id:'w2', a:{x:200,y:5}, b:{x:205,y:160}, lengthCm:300 },
              { id:'w3', a:{x:205,y:160}, b:{x:5,y:155}, lengthCm:400 },
              { id:'w4', a:{x:5,y:155}, b:{x:0,y:0}, lengthCm:last }
            ],
            openings
          });

          const good = solveFloorPlan(rect(), { mode:'normal' });
          assert.equal(good.success, true);
          assert.equal(good.closure.closed, true);
          assert.equal(good.walls.find(w=>w.id==='w1').lengthCm, 400);
          assert.ok(good.verification.maxLengthErrorCm < 1e-6);

          const mismatch = solveFloorPlan(rect(298), { mode:'normal' });
          assert.equal(mismatch.walls.find(w=>w.id==='w4').lengthCm, 298);
          assert.equal(mismatch.closure.closed, false);
          assert.ok(Math.abs(mismatch.closure.errorCm - 2) < 0.05);

          const door = solveFloorPlan(rect(300, [
            { id:'d1', type:'door', wallId:'w1', widthCm:80, referenceEnd:'a', offsetCm:120 }
          ]));
          const d1 = door.openings.find(o=>o.id==='d1');
          assert.equal(d1.valid, true);
          assert.ok(Math.abs(d1.centerFromACm - 160) < 1e-6);

          console.log('GE360 geometry smoke tests OK');
          NODE

      - name: Room and surface smoke tests
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildFaces, findFaceAtPoint, calculateSurfaces } from './js/room-surfaces.js';

          const walls = [
            { id:'w1', a:{x:0,y:0}, b:{x:400,y:0}, lengthCm:400 },
            { id:'w2', a:{x:400,y:0}, b:{x:400,y:300}, lengthCm:300 },
            { id:'w3', a:{x:400,y:300}, b:{x:0,y:300}, lengthCm:400 },
            { id:'w4', a:{x:0,y:300}, b:{x:0,y:0}, lengthCm:300 }
          ];

          const faces = buildFaces(walls);
          assert.equal(faces.length, 1);
          assert.ok(Math.abs(faces[0].area - 120000) < 1e-6);
          assert.ok(findFaceAtPoint(walls, {x:200,y:150}));

          const room = { id:'r1', name:'Cucina', wallIds:['w1','w2','w3','w4'] };
          const m = calculateSurfaces(walls, [room], 2.7);
          assert.ok(Math.abs(m.totals.floorM2 - 12) < 1e-9);
          assert.ok(Math.abs(m.totals.ceilingM2 - 12) < 1e-9);
          assert.ok(Math.abs(m.totals.wallsM2 - 37.8) < 1e-9);
          assert.ok(Math.abs(m.totals.wallsCeilingM2 - 49.8) < 1e-9);
          assert.equal(m.roomMetrics[0].room.name, 'Cucina');

          // Stanza piccola 2x3 m disegnata con piccoli gap tra tutti i quattro lati.
          // Le misure reali sono autorevoli: deve risultare circa 6,0 m².
          const small23 = [
            { id:'s1', a:{x:10,y:0}, b:{x:190,y:0}, lengthCm:200 },
            { id:'s2', a:{x:200,y:10}, b:{x:200,y:290}, lengthCm:300 },
            { id:'s3', a:{x:190,y:300}, b:{x:10,y:300}, lengthCm:200 },
            { id:'s4', a:{x:0,y:290}, b:{x:0,y:10}, lengthCm:300 }
          ];
          const small = calculateSurfaces(small23, [], 2.7);
          assert.equal(small.faces.length, 1);
          assert.equal(small.faces[0].quality, 'estimated');
          assert.ok(Math.abs(small.totals.floorM2 - 6) < 0.08, '2x3 floor should be ~6 m²');
          assert.ok(Math.abs(small.totals.ceilingM2 - 6) < 0.08);
          assert.ok(Math.abs(small.totals.wallsM2 - 27) < 1e-9);
          assert.ok(Math.abs(small.totals.wallsCeilingM2 - 33) < 0.08);

          // Gap indicativo: ultimo muro termina 20 cm prima del primo.
          const gap20 = [
            { id:'w1', a:{x:0,y:0}, b:{x:400,y:0}, lengthCm:400 },
            { id:'w2', a:{x:400,y:0}, b:{x:400,y:300}, lengthCm:300 },
            { id:'w3', a:{x:400,y:300}, b:{x:0,y:300}, lengthCm:400 },
            { id:'w4', a:{x:0,y:300}, b:{x:0,y:20}, lengthCm:280 }
          ];
          const m20 = calculateSurfaces(gap20, [], 2.7);
          assert.equal(m20.faces.length, 1);
          assert.equal(m20.faces[0].quality, 'estimated');
          assert.ok(Math.abs(m20.faces[0].maxGapCm - 20) < 0.5);

          // Gap più grande ma ancora utilizzabile: 60 cm -> DA VERIFICARE.
          const gap60 = [
            { id:'w1', a:{x:0,y:0}, b:{x:400,y:0}, lengthCm:400 },
            { id:'w2', a:{x:400,y:0}, b:{x:400,y:300}, lengthCm:300 },
            { id:'w3', a:{x:400,y:300}, b:{x:0,y:300}, lengthCm:400 },
            { id:'w4', a:{x:0,y:300}, b:{x:0,y:60}, lengthCm:240 }
          ];
          const m60 = calculateSurfaces(gap60, [], 2.7);
          assert.equal(m60.faces.length, 1);
          assert.equal(m60.faces[0].quality, 'verify');

          // Oltre 80 cm niente chiusura automatica.
          const gap100 = [
            { id:'w1', a:{x:0,y:0}, b:{x:400,y:0}, lengthCm:400 },
            { id:'w2', a:{x:400,y:0}, b:{x:400,y:300}, lengthCm:300 },
            { id:'w3', a:{x:400,y:300}, b:{x:0,y:300}, lengthCm:400 },
            { id:'w4', a:{x:0,y:300}, b:{x:0,y:100}, lengthCm:200 }
          ];
          const m100 = calculateSurfaces(gap100, [], 2.7);
          assert.equal(m100.faces.length, 0);

          console.log('GE360 room/surface smoke tests OK');
          NODE

      - name: Check secondary tools drawer
        run: |
          grep -q 'id="toolsBtn"' index.html
          grep -q 'id="toolsBackdrop"' index.html
          grep -q 'class="tools-grid"' index.html
          if grep -q 'class="work-actions"' index.html; then
            echo "Old floating work-actions still present"
            exit 1
          fi
          grep -q "function openTools" js/app.js
          grep -q "function closeTools" js/app.js
          grep -q "function runTool" js/app.js
          grep -q "runTool(openNoteTargetChooser)" js/app.js
          grep -q "runTool(openRoomPicker)" js/app.js
          grep -q "runTool(openSurfaces)" js/app.js
          grep -q "runTool(openPresentation)" js/app.js
          grep -q "runTool(openSolver)" js/app.js

      - name: Check small-room presentation guard
        run: |
          grep -q "var hasFaces = !!(cache.faces && cache.faces.length)" js/app.js
          grep -q "DA VERIFICARE" js/app.js

      - name: Check quick edit and presentation hooks
        run: |
          grep -q "id=\"presentBtn\"" index.html
          grep -q "id=\"presentationCanvas\"" index.html
          grep -q "id=\"deleteOpeningBtn\"" index.html
          grep -q "function editWallMeasurement" js/app.js
          grep -q "function editOpening" js/app.js
          grep -q "function renderPresentation" js/app.js

      - name: Check DOM ids and module packaging
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("js/app.js").read_text(encoding="utf-8")
          id_list = re.findall(r'id=["\']([^"\']+)["\']', html)
          ids = set(id_list)
          duplicates = sorted({x for x in id_list if id_list.count(x) > 1})
          if duplicates:
              raise SystemExit("Duplicate DOM ids in index.html: " + ", ".join(duplicates))

          refs = set(re.findall(r"\$\(['\"]([^'\"]+)['\"]\)", js))
          missing = sorted(refs - ids)
          if missing:
              raise SystemExit("DOM ids referenced by app.js but missing in index.html: " + ", ".join(missing))

          imports = re.findall(r"^import\s+.*?from\s+['\"]([^'\"]+)['\"]", js, re.M)
          for rel in imports:
              path = (Path("js") / rel).resolve()
              if not path.exists():
                  raise SystemExit(f"Missing imported module: {rel}")

          workflow = Path(".github/workflows/android-apk.yml").read_text(encoding="utf-8")
          if "geometry-engine" not in workflow:
              raise SystemExit("Android workflow does not package geometry-engine")
          print("DOM/module/package checks OK")
          PY

      - name: Check backend syntax and v4 payload fields
        run: |
          python3 -m py_compile backend/app.py
          grep -q "version: int = 4" backend/app.py
          grep -q "rooms: list" backend/app.py
          grep -q "wallHeightM: float" backend/app.py
          grep -q "surfaces: dict" backend/app.py

      - name: Check frontend mobile interaction guards
        run: |
          grep -q "function cancelPickModes" js/app.js
          grep -q "pointercancel" js/app.js
          grep -q "e.isPrimary === false" js/app.js
          grep -q "notes = notes.filter" js/app.js
          grep -q "z-index:400" css/app.css
          grep -q "z-index:8" css/app.css

      - name: Check note draft safety and room relabeling
        run: |
          grep -q "function closeNoteEditor(saveDraft)" js/app.js
          grep -q "saveCurrentNote(true)" js/app.js
          grep -q "closeNoteEditor(false)" js/app.js
          grep -q "note.targetType === 'wall'" js/app.js
          grep -q "note.targetType === 'opening'" js/app.js

      - name: Check construction notes and Debian LLM integration
        run: |
          grep -q 'id="notesBtn"' index.html
          grep -q 'id="noteRawText"' index.html
          grep -q 'id="rewriteNoteBtn"' index.html
          grep -q "plan.notes = clone(notes)" js/app.js
          grep -q "notes: plan.notes || \[\]" js/processed-plan.js
          grep -q "settings.serverUrl + '/notes/rewrite'" js/app.js
          grep -q '@app.post("/api/v1/notes/rewrite"' backend/app.py
          grep -q "require_key(x_ge360_api_key)" backend/app.py
          grep -q "OLLAMA_BASE_URL" backend/app.py
          grep -q "OLLAMA_MODEL" backend/app.py

      - name: Check Elaborati backend integration hooks
        run: |
          node --check js/backend-client.js
          node --check js/processed-plan.js
          node --check js/processed-files.js
          node --check js/processed-viewer.js
          node --check js/view3d.js
          grep -q 'id="processedWorkspace"' index.html
          grep -q 'id="elaborateBtn"' index.html
          grep -q "function startProcessing" js/app.js
          grep -q "PROCESS_POLL_MS = 2000" js/app.js
          grep -q "ge360-rilievo-library-v3" js/app.js

      - name: Verify engine stays isolated
        run: |
          if grep -RInE 'document\.|window\.|fetch\(|XMLHttpRequest|localStorage|navigator\.' geometry-engine --include='*.js'; then
            echo "Geometry engine must not depend on UI/network APIs"
            exit 1
          fi
