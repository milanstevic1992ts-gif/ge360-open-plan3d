name: GE360 Rilievo APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web and Capacitor dependencies
        run: npm install

      - name: Check frontend and QR parser
        run: |
          node --check js/app.js
          node --check js/backend-bridge.js
          node --check js/backend-client.js
          node --check js/backend-results.js
          node --check js/plan-payload.js
          node scripts/test-backend-bridge.mjs
          node scripts/test-backend-client.mjs
          node scripts/test-room-template.mjs

      - name: Set Android version
        run: |
          echo "GE360_VERSION_CODE=$((26000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "GE360_VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare Capacitor Android
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html www/
          cp -r css js geometry-engine www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ge360.rilievo",
            "appName": "GE360 Rilievo",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          python3 scripts/prepare-android-native.py

      - name: Build APKs
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GE360-Rilievo-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk GE360-Rilievo-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GE360-Rilievo-APK
          path: GE360-Rilievo-debug.apk
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: GE360-Rilievo-Release-Unsigned
          path: GE360-Rilievo-release-unsigned.apk
          retention-days: 14

      - name: Package official Android signing tools
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -f "$BUILD_TOOLS/lib/apksigner.jar"
          mkdir -p android-signing-tools/lib
          cp "$BUILD_TOOLS/apksigner" android-signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" android-signing-tools/lib/
          if [[ -x "$BUILD_TOOLS/zipalign" ]]; then cp "$BUILD_TOOLS/zipalign" android-signing-tools/; fi
          printf '%s\n' "$(basename "$BUILD_TOOLS")" > android-signing-tools/build-tools-version.txt

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools
          path: android-signing-tools
          retention-days: 2
