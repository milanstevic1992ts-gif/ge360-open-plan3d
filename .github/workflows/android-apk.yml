name: GE360 Rilievo APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check JavaScript
        run: node --check js/app.js

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          mkdir -p www
          cp index.html www/
          cp -r css js geometry-engine www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ge360.rilievo",
            "appName": "GE360 Rilievo",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GE360-Rilievo-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GE360-Rilievo-APK
          path: GE360-Rilievo-v1-debug.apk
          retention-days: 14
