name: GE360 Rilievo Current Release APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check JavaScript
        run: |
          cp js/app.js /tmp/ge360-app.mjs
          cp js/room-surfaces.js /tmp/ge360-room-surfaces.mjs
          node --check /tmp/ge360-app.mjs
          node --check /tmp/ge360-room-surfaces.mjs

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          mkdir -p www
          cp index.html www/
          cp -r css js geometry-engine www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ge360.rilievo",
            "appName": "GE360 Rilievo",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode 2")
          s=s.replace('versionName "1.0"', 'versionName "1.1"')
          p.write_text(s)
          PY
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build unsigned release
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -f "$APK"
          cp "$APK" GE360-Rilievo-v1.1-unsigned.apk
          ls -lh GE360-Rilievo-v1.1-unsigned.apk

      - name: Bundle Android signing tool
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          tar -C "$BUILD_TOOLS" -czf android-apksigner-linux.tar.gz apksigner lib/apksigner.jar

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: GE360-Rilievo-v1.1-Unsigned
          path: |
            GE360-Rilievo-v1.1-unsigned.apk
            android-apksigner-linux.tar.gz
          retention-days: 3
