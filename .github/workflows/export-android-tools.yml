name: Export Android Signing Tools

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Package official Android signing tools
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS"
          mkdir -p android-signing-tools/lib
          cp "$BUILD_TOOLS/apksigner" android-signing-tools/
          cp "$BUILD_TOOLS/zipalign" android-signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" android-signing-tools/lib/
          LIBCPP="$(find "$BUILD_TOOLS" -type f -name "libc++.so" | head -1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" android-signing-tools/libc++.so
          chmod +x android-signing-tools/apksigner android-signing-tools/zipalign
          basename "$BUILD_TOOLS" > android-signing-tools/version.txt

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools
          path: android-signing-tools
          retention-days: 1
