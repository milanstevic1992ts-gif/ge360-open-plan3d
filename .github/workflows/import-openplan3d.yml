name: Import OpenPlan3D

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.title == 'IMPORT OPENPLAN3D NOW'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone upstream OpenPlan3D
        run: |
          git clone --depth 1 https://github.com/laanlabs/openPlan3D.git /tmp/openPlan3D

      - name: Replace repository contents with upstream
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/openPlan3D/ ./
          git status --short

      - name: Commit imported repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import laanlabs/openPlan3D in full (workflow files follow separately)"
          git push origin HEAD:main
