name: GE360 Frontend Elaborati Check

on:
  push:
    branches: [ frontend-backend-elaborati-v1 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/backend-client.js
          node --check js/processed-plan.js
          node --check js/processed-files.js
          node --check js/processed-viewer.js
          node --check js/view3d.js
          node --check js/room-surfaces.js
          node --check js/sketch-snap.js
          for f in geometry-engine/*.js; do node --check "$f"; done

      - name: Integration and compatibility tests
        run: node --test tests/*.test.mjs

      - name: Ensure no repository API key
        run: |
          if grep -RInE 'GE360_RILIEVO_API_KEY[[:space:]]*=[[:space:]]*["'\'''][^"'\''']+|apiKey[[:space:]]*:[[:space:]]*["'\'''][A-Za-z0-9_-]{20,}' . --exclude-dir=.git --exclude='*.md'; then
            echo "Potential hardcoded API key found"
            exit 1
          fi
